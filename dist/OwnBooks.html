<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f50">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OwnBooks</title>

<style>:root{
  --bg:#f5f6f4;--panel:#ffffff;--ink:#1d2321;--muted:#66706c;--line:#dde2df;--soft:#eef1ef;
  --brand:#1f6f50;--brand-ink:#ffffff;--brand-soft:#e3f1ea;--danger:#b3261e;--warn:#9a6700;--ok:#1f6f50;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614;--panel:#1a201d;--ink:#e6ebe8;--muted:#9aa5a0;--line:#2c3430;--soft:#222a26;
  --brand:#4fbf8b;--brand-ink:#08130e;--brand-soft:#1d3329;--danger:#f2867e;--warn:#e0b04a;--ok:#4fbf8b;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#121614;--panel:#1a201d;--ink:#e6ebe8;--muted:#9aa5a0;--line:#2c3430;--soft:#222a26;
  --brand:#4fbf8b;--brand-ink:#08130e;--brand-soft:#1d3329;--danger:#f2867e;--warn:#e0b04a;--ok:#4fbf8b;--shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;font-size:18px;padding:4px 10px 14px;color:var(--brand)}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
nav.side a{display:block;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;margin:1px 0}
nav.side a:hover{background:var(--soft)}
nav.side a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
main{padding:18px 22px 60px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:20px;margin:0;flex:1}
.status{font-size:12px;color:var(--muted)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover{background:var(--soft)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary,.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.danger{color:var(--danger)}
button.icon{padding:4px 9px}
button.sm{padding:4px 8px;font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 8px;width:100%;min-width:0}
textarea{min-height:56px}
input.num{text-align:right}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.sec td{font-weight:650;background:var(--soft)}
tr.tot td{font-weight:650;border-top:2px solid var(--ink)}
tr.grand td{font-weight:750;border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}
td.ind{padding-left:26px}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.open{background:#fff3cd;color:#7a5600}.pill.void{background:#f8d7da;color:#842029}.pill.paid{background:var(--brand-soft);color:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.open{background:#3b3115;color:#e0b04a}:root:not([data-theme="light"]) .pill.void{background:#3d1d1d;color:#f2867e}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:end}
.filters>div{min-width:130px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
dialog{border:none;border-radius:14px;padding:0;width:min(980px,calc(100vw - 16px));max-height:94vh;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.mhead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.mhead h2{margin:0;font-size:17px;flex:1}
.mbody{padding:16px}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.mfoot .sp{flex:1}
.err{color:var(--danger);font-weight:600;margin:8px 0}
.lines td{padding:4px;border-bottom:none}
.lines th{padding:6px 4px}
.totals{display:grid;grid-template-columns:auto 140px;gap:4px 14px;justify-content:end;margin-top:10px;font-variant-numeric:tabular-nums}
.totals .t{font-weight:700;font-size:16px}
.section{margin:16px 0 8px;font-weight:650}
.receipts{display:flex;gap:10px;flex-wrap:wrap}
.receipt{position:relative;width:110px}
.receipt img,.receipt .doc{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--soft);cursor:pointer}
.receipt button{position:absolute;top:4px;right:4px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{text-align:right}
.hint{font-size:12px;color:var(--muted)}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .items{position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;z-index:20;min-width:210px}
details.menu .items a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;cursor:pointer}
details.menu .items a:hover{background:var(--soft)}
details.menu .items hr{border:none;border-top:1px solid var(--line);margin:4px}
.report h2{margin:0;font-size:16px}.report h3{margin:2px 0;font-size:15px}
.diff{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;background:var(--soft);padding:8px;border-radius:8px;margin-top:6px}
.fab{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;height:auto;display:flex;overflow-x:auto;gap:2px;padding:6px;border-right:none;border-bottom:1px solid var(--line);z-index:10}
  nav.side .logo{display:none}
  nav.side a{white-space:nowrap;padding:7px 10px}
  main{padding:14px 16px 90px}
  .fab{display:block;position:fixed;right:16px;bottom:18px;z-index:30;border-radius:99px;padding:14px 18px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .totals{grid-template-columns:auto 110px}
  .hide-sm{display:none}
  table.lines thead{display:none}
  table.lines tr.line{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
  table.lines tr.line td{display:block;padding:0;min-width:0!important}
  table.lines tr.line td:first-child,table.lines tr.line td:nth-child(2){grid-column:1/-1}
  table.lines input,table.lines select{min-width:0!important}
}
@media print{nav.side,.top button,.filters,.fab,.noprint{display:none!important}.app{display:block}.tablewrap{border:none}}
</style>
</head><body>
<div class="app"><nav class="side" id="nav"></nav><main id="main"><p style="padding:20px">Loading your books…</p></main></div>
<dialog id="modal"></dialog>
<noscript>OwnBooks needs JavaScript enabled.</noscript>
<script>'use strict';
/* ============================================================
   OwnBooks — local-first bookkeeping. All data stays on this device
   (IndexedDB in this browser) unless YOU export it.
   ============================================================ */

/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2 = n => Math.round(((+n) || 0) * 100 + Number.EPSILON * 100) / 100;
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const nowISO = () => new Date().toISOString();
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
function addDays(ds, n) { const d = new Date(ds + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 864e5); }
let _fmt;
function fmt(n) { if (!_fmt) { try { _fmt = new Intl.NumberFormat(undefined, { style: 'currency', currency: db.meta.currency || 'CAD' }); } catch (e) { _fmt = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); } } return _fmt.format(r2(n)); }
function fmtDate(d) { return d || ''; }
function toast(msg) { const s = $('#status'); if (s) { s.textContent = msg; clearTimeout(toast.t); toast.t = setTimeout(() => s.textContent = storageNote(), 3500); } }
function download(name, data, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function toCSV(rows) { return rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n'); }

/* ---------- constants ---------- */
const TYPES = ['Asset', 'Liability', 'Equity', 'Income', 'Cost of Goods Sold', 'Expense', 'Other Income', 'Other Expense'];
const SUBTYPES = {
  Asset: ['Bank', 'Accounts Receivable', 'Other Current Asset', 'Fixed Asset', 'Other Asset'],
  Liability: ['Accounts Payable', 'Credit Card', 'Other Current Liability', 'Long Term Liability'],
  Equity: ['Equity'], Income: ['Income'], 'Cost of Goods Sold': ['Cost of Goods Sold'], Expense: ['Expense'],
  'Other Income': ['Other Income'], 'Other Expense': ['Other Expense']
};
const DEBIT_NORMAL = new Set(['Asset', 'Cost of Goods Sold', 'Expense', 'Other Expense']);
const PL_TYPES = new Set(['Income', 'Cost of Goods Sold', 'Expense', 'Other Income', 'Other Expense']);
const TT = {
  invoice: { label: 'Invoice', party: 'customer', lines: 'item', tax: 'sale', due: true, receipts: true },
  payment: { label: 'Payment Received', party: 'customer', link: 'invoice', bank: 'Deposit to', amount: true, receipts: true },
  deposit: { label: 'Income / Deposit', party: 'customer', partyOptional: true, lines: 'amount', tax: 'sale', bank: 'Deposit to', receipts: true },
  bill: { label: 'Bill', party: 'vendor', lines: 'amount', tax: 'purchase', due: true, receipts: true },
  billpay: { label: 'Bill Payment', party: 'vendor', link: 'bill', bank: 'Paid from', amount: true, receipts: true },
  expense: { label: 'Expense', party: 'vendor', partyOptional: true, lines: 'amount', tax: 'purchase', bank: 'Paid from', receipts: true },
  transfer: { label: 'Transfer', bank: 'Transfer from', to: true, amount: true },
  journal: { label: 'Journal Entry', lines: 'journal', receipts: true }
};
/* Canada T2125 (self-employment) lines – used to build the income tax summary. Editable per account. */
const TAX_LINES = {
  '': '— not mapped —',
  '8000': '8000 Gross sales / professional fees', '8230': '8230 Other income', '8290': '8290 Reserves / other',
  '8320': '8320 Cost of goods sold (purchases)', '8521': '8521 Advertising', '8523': '8523 Meals & entertainment (50%)',
  '8590': '8590 Bad debts', '8690': '8690 Insurance', '8710': '8710 Interest & bank charges', '8760': '8760 Business taxes, licences, memberships',
  '8810': '8810 Office expenses', '8811': '8811 Office stationery & supplies', '8860': '8860 Professional fees (legal, accounting)',
  '8871': '8871 Management & administration fees', '8910': '8910 Rent', '8960': '8960 Repairs & maintenance',
  '9060': '9060 Salaries, wages & benefits', '9180': '9180 Property taxes', '9200': '9200 Travel', '9220': '9220 Utilities',
  '9224': '9224 Fuel costs (non-vehicle)', '9275': '9275 Delivery, freight & express', '9281': '9281 Motor vehicle expenses',
  '9936': '9936 Capital cost allowance (CCA)', '9270': '9270 Other expenses', 'NONDED': 'Not deductible / personal'
};

/* ---------- storage (IndexedDB) ---------- */
const IDB_NAME = 'ownbooks', IDB_VER = 1;
let idb;
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, IDB_VER);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbReq(store, mode, fn) { return new Promise((res, rej) => { const tx = idb.transaction(store, mode); const st = tx.objectStore(store); const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); }
const kvGet = k => idbReq('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => idbReq('kv', 'readwrite', s => s.put(v, k));
const fileGet = id => idbReq('files', 'readonly', s => s.get(id));
const filePut = f => idbReq('files', 'readwrite', s => s.put(f));
const fileDel = id => idbReq('files', 'readwrite', s => s.delete(id));
const fileAll = () => idbReq('files', 'readonly', s => s.getAll());
const fileClear = () => idbReq('files', 'readwrite', s => s.clear());

let db, fileHandle = null, saveTimer;
function save() {
  db.meta.updated = nowISO();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await kvSet('db', db); toast('Saved on this device · ' + new Date().toLocaleTimeString()); } catch (e) { alert('Could not save: ' + e.message); }
    if (fileHandle) writeLinkedFile();
  }, 150);
}
function storageNote() { return fileHandle ? 'Auto-saving to linked file + this device' : 'Data stored only on this device'; }

/* ---------- seed data ---------- */
function seed() {
  const A = (number, name, type, subtype, taxLine = '') => ({ id: uid(), number, name, type, subtype: subtype || SUBTYPES[type][0], active: true, desc: '', taxLine });
  const tax = A('2200', 'GST/HST Payable', 'Liability', 'Other Current Liability');
  const accounts = [
    A('1000', 'Chequing', 'Asset', 'Bank'), A('1010', 'Savings', 'Asset', 'Bank'),
    A('1200', 'Accounts Receivable', 'Asset', 'Accounts Receivable'), A('1300', 'Prepaid Expenses', 'Asset', 'Other Current Asset'),
    A('1500', 'Equipment & Furniture', 'Asset', 'Fixed Asset'), A('1510', 'Computers', 'Asset', 'Fixed Asset'),
    A('2000', 'Accounts Payable', 'Liability', 'Accounts Payable'), A('2100', 'Business Credit Card', 'Liability', 'Credit Card'),
    tax, A('2300', 'Income Tax Payable', 'Liability', 'Other Current Liability'), A('2500', 'Loan Payable', 'Liability', 'Long Term Liability'),
    A('3000', "Owner's Equity / Contributions", 'Equity'), A('3100', "Owner's Draws", 'Equity'), A('3900', 'Opening Balance Equity', 'Equity'),
    A('4000', 'Sales / Professional Fees', 'Income', null, '8000'), A('4100', 'Other Income', 'Other Income', null, '8230'), A('4200', 'Interest Income', 'Other Income', null, '8230'),
    A('5000', 'Cost of Goods Sold', 'Cost of Goods Sold', null, '8320'),
    A('6000', 'Advertising & Marketing', 'Expense', null, '8521'), A('6010', 'Bank Charges & Fees', 'Expense', null, '8710'),
    A('6020', 'Dues, Licences & Memberships', 'Expense', null, '8760'), A('6030', 'Insurance', 'Expense', null, '8690'),
    A('6040', 'Interest Expense', 'Expense', null, '8710'), A('6050', 'Meals & Entertainment', 'Expense', null, '8523'),
    A('6060', 'Office Supplies', 'Expense', null, '8811'), A('6070', 'Software & Subscriptions', 'Expense', null, '8810'),
    A('6080', 'Professional Fees', 'Expense', null, '8860'), A('6090', 'Rent', 'Expense', null, '8910'),
    A('6100', 'Repairs & Maintenance', 'Expense', null, '8960'), A('6110', 'Telephone & Internet', 'Expense', null, '9220'),
    A('6120', 'Travel', 'Expense', null, '9200'), A('6130', 'Utilities', 'Expense', null, '9220'),
    A('6140', 'Vehicle Expenses', 'Expense', null, '9281'), A('6150', 'Wages & Salaries', 'Expense', null, '9060'),
    A('6160', 'Shipping & Courier', 'Expense', null, '9275'), A('6900', 'Other / Miscellaneous', 'Expense', null, '9270'),
    A('6990', 'Uncategorized Expense', 'Expense', null, '9270'), A('4990', 'Uncategorized Income', 'Income', null, '8000')
  ];
  return {
    version: 1,
    meta: {
      company: 'My Business', legalName: '', taxNumber: '', address: '', email: '', phone: '', currency: 'CAD', fyStartMonth: 1,
      taxAccountId: tax.id, nextInvoice: 1001, theme: 'auto', created: nowISO(), updated: nowISO(),
      taxRates: [{ id: uid(), name: 'HST 13%', rate: 13 }, { id: uid(), name: 'GST 5%', rate: 5 }, { id: uid(), name: 'HST 15%', rate: 15 }, { id: uid(), name: 'Exempt / No tax', rate: 0 }],
      customFields: [], invoiceTerms: 'Payment due within 30 days. Thank you for your business.', defaultTermsDays: 30
    },
    accounts, customers: [], vendors: [], projects: [], txns: [], bankFeed: [], bankRules: [], history: []
  };
}
function normalize(d) {
  const s = seed();
  d.meta = Object.assign({}, s.meta, d.meta || {});
  for (const k of ['accounts', 'customers', 'vendors', 'projects', 'txns', 'bankFeed', 'bankRules', 'history', 'imports']) if (!Array.isArray(d[k])) d[k] = [];
  if (!d.accounts.length) d.accounts = s.accounts;
  return d;
}

/* ---------- change history (audit trail with restore) ---------- */
const COLL = { account: 'accounts', customer: 'customers', vendor: 'vendors', project: 'projects', txn: 'txns', bankRule: 'bankRules' };
function log(entity, id, action, before, after) {
  db.history.unshift({ id: uid(), at: nowISO(), entity, entityId: id, action, before: clone(before), after: clone(after) });
  if (db.history.length > 5000) db.history.length = 5000;
}
function upsert(entity, obj, action) {
  const arr = db[COLL[entity]]; const i = arr.findIndex(x => x.id === obj.id); const before = i >= 0 ? arr[i] : null;
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  log(entity, obj.id, action || (before ? 'edited' : 'created'), before, obj); save();
}
function removeEntity(entity, id, action) {
  const arr = db[COLL[entity]]; const i = arr.findIndex(x => x.id === id); if (i < 0) return;
  const before = arr[i]; arr.splice(i, 1); log(entity, id, action || 'deleted', before, null); save();
}
function saveMeta(newMeta, action = 'edited') { const before = db.meta; db.meta = newMeta; _fmt = null; log('settings', 'meta', action, before, newMeta); save(); }

/* ---------- lookups ---------- */
const acct = id => db.accounts.find(a => a.id === id);
const acctName = a => a ? (a.number ? a.number + ' · ' : '') + a.name : '(missing account)';
const byNum = (a, b) => (a.number || '').localeCompare(b.number || '', undefined, { numeric: true }) || a.name.localeCompare(b.name);
const party = (kind, id) => (kind === 'vendor' ? db.vendors : db.customers).find(p => p.id === id);
const partyOf = t => { const k = TT[t.type]?.party; return k ? party(k, t.partyId) : null; };
const proj = id => db.projects.find(p => p.id === id);
const isBankish = a => a.subtype === 'Bank' || a.subtype === 'Credit Card';
const arId = () => (db.accounts.find(a => a.subtype === 'Accounts Receivable') || {}).id;
const apId = () => (db.accounts.find(a => a.subtype === 'Accounts Payable') || {}).id;
function fyStart(ds) { const m = +db.meta.fyStartMonth || 1; let y = +ds.slice(0, 4); if (+ds.slice(5, 7) < m) y--; return `${y}-${pad(m)}-01`; }

/* ---------- accounting engine ---------- */
const sumLines = t => r2((t.lines || []).reduce((s, l) => s + (+l.amount || 0), 0));
function txTotal(t) {
  switch (t.type) {
    case 'invoice': case 'bill': case 'expense': case 'deposit': return r2(sumLines(t) + (+t.tax || 0));
    case 'journal': return r2((t.lines || []).reduce((s, l) => s + (+l.debit || 0), 0));
    default: return r2(+t.amount || 0);
  }
}
/* Every transaction becomes balanced double-entry postings. Nothing is stored twice – edit a transaction and every report updates. */
function postings(t) {
  const P = [];
  const add = (accountId, dr, cr, memo, projectId) => {
    const net = r2((+dr || 0) - (+cr || 0)); if (!accountId || !net) return;
    P.push({ accountId, debit: net > 0 ? net : 0, credit: net < 0 ? -net : 0, memo: memo || t.memo || '', projectId: projectId || t.projectId || '' });
  };
  const L = t.lines || [], tax = r2(+t.tax || 0), total = txTotal(t), amt = r2(+t.amount || 0), taxAcc = db.meta.taxAccountId;
  switch (t.type) {

    case 'deposit': add(t.bankAccountId, total, 0); L.forEach(l => add(l.accountId, 0, l.amount, l.desc, l.projectId)); add(taxAcc, 0, tax, 'Sales tax collected'); break;
    case 'bill': L.forEach(l => add(l.accountId, l.amount, 0, l.desc, l.projectId)); add(taxAcc, tax, 0, 'Input tax credit'); add(apId(), 0, total); break;
    case 'expense': L.forEach(l => add(l.accountId, l.amount, 0, l.desc, l.projectId)); add(taxAcc, tax, 0, 'Input tax credit'); add(t.bankAccountId, 0, total); break;
    case 'payment': add(t.bankAccountId, amt, 0); add(arId(), 0, amt); break;
    case 'billpay': add(apId(), amt, 0); add(t.bankAccountId, 0, amt); break;

const live = t => !t.void;

      if (projectId && p.projectId !== projectId) continue;

}

let pendingFiles = []; // attachments for the record being edited
async function compressImage(file, maxDim = 1800, q = 0.82) {
  if (!file.type.startsWith('image/') || file.type === 'image/gif' || file.type === 'image/svg+xml') return file;

    const bmp = await createImageBitmap(file);
    const s = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);

    return blob && blob.size < file.size ? blob : file;
  } catch (e) { return file; }
}

  return $$('#lines tr.line').map(tr => { const o = {}; tr.querySelectorAll('[data-f]').forEach(i => o[i.dataset.f] = i.type === 'number' ? (i.value === '' ? '' : +i.value) : i.value); return o; })
    .filter(l => l.accountId || +l.amount || +l.debit || +l.credit || l.desc)
    .map(l => { for (const k of ['amount', 'debit', 'credit']) if (k in l) l[k] = l[k] === '' ? 0 : r2(l[k]); return l; });
}
function recalc(e) {
  const f = $('#txform'); if (!f || !cur) return; const cfg = TT[cur.type];
  if (e && e.target && (e.target.dataset.f === 'qty' || e.target.dataset.f === 'rate')) { const tr = e.target.closest('tr'); const q = +tr.querySelector('[data-f=qty]').value || 0, r = +tr.querySelector('[data-f=rate]').value || 0; tr.querySelector('[data-f=amount]').value = r2(q * r); }
  if (e && e.target && e.target.name && e.target.name.startsWith('cf_')) return;
  let h = '';
  if (cfg.lines === 'journal') {
    const L = readLines(), d = r2(L.reduce((s, l) => s + l.debit, 0)), c = r2(L.reduce((s, l) => s + l.credit, 0));
    h = `<span>Total debits</span><span class="right">${fmt(d)}</span><span>Total credits</span><span class="right">${fmt(c)}</span><span>Difference</span><span class="right ${d !== c ? 'err' : ''}">${fmt(d - c)}</span>`;
  } else if (cfg.lines) {
    const L = readLines(); let sub = r2(L.reduce((s, l) => s + l.amount, 0)); let tax = 0;
    if (cfg.tax) {
      const rate = (db.meta.taxRates.find(r => r.id === f.elements.taxRateId.value) || {}).rate || 0; const ti = f.elements.tax; const incl = f.elements.taxIncl.checked;
      if (!ti.dataset.manual) ti.value = rate ? (incl ? r2(sub - sub / (1 + rate / 100)) : r2(sub * rate / 100)) : '';
      tax = r2(+ti.value || 0); if (incl) sub = r2(sub - tax);
      h = `<span>Subtotal</span><span class="right">${fmt(sub)}</span><span>Tax</span><span class="right">${fmt(tax)}</span>`;
    }
    h += `<span class="t">Total</span><span class="right t">${fmt(sub + tax)}</span>`;

}
function saveTx(andNew) {
  const f = $('#txform'), E = f.elements, cfg = TT[cur.type], err = m => { $('#txerr').textContent = m; return false; };
  const t = cur.orig ? clone(cur.orig) : { id: cur.id, type: cur.type, created: nowISO() };
  t.date = E.date.value; t.num = E.num.value.trim(); t.memo = E.memo.value; t.projectId = E.projectId.value === '__new' ? '' : E.projectId.value;
  if (cfg.party) t.partyId = E.partyId.value === '__new' ? '' : E.partyId.value;
  if (cfg.due) t.dueDate = E.dueDate.value;
  if (cfg.bank) t.bankAccountId = E.bankAccountId.value;
  if (cfg.to) t.toAccountId = E.toAccountId.value;
  if (cfg.link) t.linkId = E.linkId.value;
  if (cfg.amount) t.amount = r2(E.amount.value);
  if (cfg.lines) { t.lines = readLines(); t.lines.forEach(l => { if (l.projectId === '__new') l.projectId = ''; if (!l.projectId && t.projectId) l.projectId = t.projectId; }); }
  if (cfg.tax) {
    t.taxRateId = E.taxRateId.value; t.tax = r2(E.tax.value); t.taxIncl = E.taxIncl.checked;
    if (t.taxIncl && t.tax) { // store lines net of tax so postings stay exact
      const gross = sumLines(t); const ratio = gross ? (gross - t.tax) / gross : 1; let run = 0;
      t.lines.forEach((l, i) => { if (i === t.lines.length - 1) l.amount = r2(gross - t.tax - run); else { l.amount = r2(l.amount * ratio); run = r2(run + l.amount); } if (cur.type === 'invoice' && l.qty) l.rate = r2(l.amount / l.qty); });
      t.taxIncl = false;
    }
  }
  t.custom = readCustom(f); if (E.void) t.void = E.void.checked; t.updated = nowISO();
  if (!t.date) return err('Date is required.');
  if (cfg.party && !cfg.partyOptional && !t.partyId) return err(`Choose a ${cfg.party === 'vendor' ? 'vendor' : 'client'}.`);
  if (cfg.bank && !t.bankAccountId) return err(`Choose the "${cfg.bank}" account.`);
  if (cfg.to && (!t.toAccountId || t.toAccountId === t.bankAccountId)) return err('Choose two different accounts to transfer between.');
  if (cfg.amount && !t.amount) return err('Enter an amount.');
  if (cfg.lines) {
    if (!t.lines.length) return err('Add at least one line.');
    if (t.lines.some(l => !l.accountId)) return err('Every line needs an account/category.');
    if (cfg.lines === 'journal') { const d = r2(t.lines.reduce((s, l) => s + l.debit, 0)), c = r2(t.lines.reduce((s, l) => s + l.credit, 0)); if (d !== c) return err(`Debits (${fmt(d)}) must equal credits (${fmt(c)}).`); if (!d) return err('Journal entry is empty.'); }
  }
  if ((cfg.tax) && t.tax && !db.meta.taxAccountId) return err('Set a sales tax account in Settings first.');
  if (cur.type === 'invoice' && t.num && /^\d+$/.test(t.num)) db.meta.nextInvoice = Math.max(+db.meta.nextInvoice || 0, +t.num + 1);
  cur.saved = true;
  upsert('txn', t);
  const fb = ui.pendingFeed; if (fb) { const it = db.bankFeed.find(x => x.id === fb); if (it) { it.status = 'added'; it.txnId = t.id; save(); } ui.pendingFeed = null; }
  const type = cur.type; closeModal(); render(); toast(TT[type].label + ' saved');
  if (andNew) openTx(type);
}
function deleteTx() {
  if (!confirm('Delete this transaction? (It stays in Change History and can be restored.) Tip: "Void" keeps it on record instead.')) return;
  const id = cur.id; cur.saved = true; removeEntity('txn', id);

function reviewTable(items) {
  if (!items.length) return `<div class="card muted">Nothing to review. <a href="javascript:void(0)" onclick="ui.bankTab='connect';render()">Connect your bank</a> or import a statement to get started.</div>`;

  </tbody></table></div>`;
}
function suggestFor(x) {
  const raw = x.desc + ' ' + (x.memo || ''); const d = (raw + ' ' + raw.replace(/[#*]?\d{3,}/g, ' ').replace(/\s+/g, ' ')).toLowerCase();
  for (const r of db.bankRules) if (r.text && d.includes(r.text.toLowerCase()) && (!r.dir || (r.dir === 'out') === (x.amount < 0))) return r;
  return {};
}
function findMatch(x) {
  return db.txns.find(t => live(t) && Math.abs(daysBetween(t.date, x.date)) <= 10 && !db.bankFeed.some(b => b.txnId === t.id) &&
    postings(t).some(p => p.accountId === x.accountId && r2(p.debit - p.credit) === r2(x.amount)));
}
function setFeed(id, status) { const it = db.bankFeed.find(x => x.id === id); it.status = status; save(); render(); }
function undoFeed(id) { const it = db.bankFeed.find(x => x.id === id); if (it.txnId && it.status === 'added' && confirm('Also delete the transaction that was created from this bank line?')) removeEntity('txn', it.txnId); it.status = 'review'; it.txnId = ''; save(); render(); }
function matchFeed(id, txnId) { const it = db.bankFeed.find(x => x.id === id); it.status = 'matched'; it.txnId = txnId; save(); render(); toast('Matched'); }
function feedToTx(x, accountId, partyId, projectId) {
  const out = x.amount < 0, amt = r2(Math.abs(x.amount)), a = acct(accountId);
  if (a && (a.type === 'Asset' || a.type === 'Liability' || a.type === 'Equity') && !PL_TYPES.has(a.type)) // transfer between balance-sheet accounts (e.g. card payment, owner draw)
    return { id: uid(), type: 'journal', date: x.date, num: '', memo: x.desc, custom: {}, created: nowISO(), updated: nowISO(), projectId,
      lines: [{ accountId: out ? accountId : x.accountId, desc: x.desc, debit: amt, credit: 0, projectId }, { accountId: out ? x.accountId : accountId, desc: x.desc, debit: 0, credit: amt, projectId }] };
  return { id: uid(), type: out ? 'expense' : 'deposit', date: x.date, num: '', partyId: partyId || '', bankAccountId: x.accountId, memo: x.memo || '', projectId, custom: {}, created: nowISO(), updated: nowISO(),
    lines: [{ accountId, desc: x.desc, amount: amt, projectId }], tax: 0 };
}
function acceptFeed(id, edit) {
  const tr = document.querySelector(`tr[data-feed="${id}"]`); const x = db.bankFeed.find(f => f.id === id);
  const accountId = tr.querySelector('[data-k=acct]').value, partyId = tr.querySelector('[data-k=party]').value.replace('__new', ''), projectId = tr.querySelector('[data-k=proj]').value.replace('__new', '');
  if (!accountId && !edit) return alert('Choose a category first (or use Edit…).');
  const t = feedToTx(x, accountId || (x.amount < 0 ? db.accounts.find(a => a.name === 'Uncategorized Expense')?.id : db.accounts.find(a => a.name === 'Uncategorized Income')?.id), partyId, projectId);
  rememberRule(x, accountId, partyId, projectId);
  if (edit) { delete t.created; openTx(t.type, null, t); ui.pendingFeed = id; return; }
  upsert('txn', t); x.status = 'added'; x.txnId = t.id; save(); render();
}
function rememberRule(x, accountId, partyId, projectId) {
  if (!accountId) return; const key = cleanDesc(x.desc); if (!key) return;
  const r = db.bankRules.find(r => r.text.toLowerCase() === key.toLowerCase());
  if (r) { if (r.auto) { r.accountId = accountId; r.partyId = partyId; r.projectId = projectId; } }
  else db.bankRules.push({ id: uid(), text: key, dir: x.amount < 0 ? 'out' : 'in', accountId, partyId, projectId, auto: true });
}
function cleanDesc(s) { return (s || '').replace(/[#*]?\d{3,}/g, ' ').replace(/\s+/g, ' ').trim().split(' ').slice(0, 3).join(' '); }
function bulkAccept() {

const BRIDGE_DEFAULT = 'http://127.0.0.1:8765';
const onBridgeOrigin = () => /^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(location.origin);
const bridgeUrl = () => db.meta.bridgeUrl || (onBridgeOrigin() ? location.origin : BRIDGE_DEFAULT);
function bridgeKey() { try { return localStorage.getItem('ownbooks-bridge-key') || ''; } catch (e) { return ''; } }
function setBridgeKey(k) { try { localStorage.setItem('ownbooks-bridge-key', (k || '').trim()); } catch (e) { } }
async function bridge(p, body) {
  let r; try { r = await fetch(bridgeUrl() + p, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-OwnBooks-Key': bridgeKey() }, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { const er = new Error('Bank Bridge is not running on this computer.'); er.down = true; throw er; }
  const j = await r.json().catch(() => ({ error: 'Unexpected response from bridge' }));
  if (!r.ok || j.error) { const er = new Error(j.error || 'Bridge error ' + r.status); er.status = r.status; er.code = j.code; throw er; }
  return j;
}
async function bridgePair() { if (!onBridgeOrigin()) return false; try { const r = await fetch(location.origin + '/pair'); if (r.ok) { setBridgeKey((await r.json()).key); return true; } } catch (e) { } return false; }

async function syncItem(itemId) {
  const L = links(); const I = L.items[itemId] || (L.items[itemId] = {});

  const r = await bridge('/sync', { itemId, cursor: I.cursor || '', startDate: start });
  let added = 0, updated = 0, removed = 0;
  for (const x of [...r.added, ...r.modified]) {
    if (x.pending || !x.date || !x.amount) continue;
    const key = x.provider + ':' + x.id; const map = L.accounts[x.accountId]; const ex = db.bankFeed.find(f => f.key === key);
    if (ex) { if (ex.status === 'review') { Object.assign(ex, { date: x.date, desc: x.desc, memo: x.memo, amount: r2(x.amount) }); updated++; } continue; }
    db.bankFeed.push({ id: uid(), accountId: map?.accountId || '', extAccountId: x.accountId, key, date: x.date, desc: x.desc, memo: x.memo, amount: r2(x.amount), status: 'review', source: x.provider, imported: nowISO() }); added++;
  }
  for (const key of r.removed || []) { const i = db.bankFeed.findIndex(f => f.key === key && f.status === 'review'); if (i >= 0) { db.bankFeed.splice(i, 1); removed++; } }

  new Set(Object.values(L.accounts).filter(m => m.itemId === itemId).map(m => m.accountId)).forEach(autoMatch);
  save();
  return `${(connCache.status?.items.find(i => i.id === itemId) || {}).institution || 'Bank'}: ${added} new${updated ? ', ' + updated + ' updated' : ''}${removed ? ', ' + removed + ' removed' : ''}`;
}

  return `<div class="filters"><div><label>Show</label><select onchange="ui.histFilter=this.value;render()"><option value="">Everything</option>${['txn', 'account', 'customer', 'vendor', 'project', 'settings'].map(e => `<option ${f === e ? 'selected' : ''}>${e}</option>`).join('')}${f && !['txn', 'account', 'customer', 'vendor', 'project', 'settings'].includes(f) ? `<option selected value="${f}">this record only</option>` : ''}</select></div></div>
  <p class="hint">Every create, edit and delete is recorded. You can freely change past entries — and restore any earlier version here.</p>
  <div class="tablewrap"><table><thead><tr><th>When</th><th>What</th><th>Action</th><th>Record</th><th></th></tr></thead><tbody>
  ${list.map(h => `<tr><td style="white-space:nowrap">${h.at.slice(0, 16).replace('T', ' ')}</td><td>${h.entity}</td><td>${h.action}</td><td>${esc(histLabel(h.entity, h.after || h.before))}${h.before && h.after ? `<details><summary class="hint">what changed</summary><div class="diff">${esc(diffText(h.before, h.after))}</div></details>` : ''}</td>
  <td style="white-space:nowrap">${h.entity === 'import' ? `<a href="#import">Undo on Import page</a>` : h.before ? `<button class="sm" onclick="restoreHist('${h.id}','before')" title="Put the record back the way it was before this change">Undo this change</button>` : `<button class="sm" onclick="restoreHist('${h.id}','before')">Undo (remove)</button>`}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No history yet.</td></tr>'}
  </tbody></table></div>`;
}
function restoreHist(hid, which) {
  const h = db.history.find(x => x.id === hid); if (!h) return; const state = h[which];
  if (!confirm('Restore this record to the version ' + (which === 'before' ? 'before' : 'after') + ' this change? (The restore is itself logged.)')) return;
  if (h.entity === 'settings') saveMeta(clone(state), 'restored');
  else if (!state) removeEntity(h.entity, h.entityId, 'restored (removed)');
  else upsert(h.entity, clone(state), 'restored');
  render(); toast('Restored');
}

    <div><label>Fiscal year starts</label><select name="fyStartMonth">${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].map((x, i) => `<option value="${i + 1}" ${+m.fyStartMonth === i + 1 ? 'selected' : ''}>${x}</option>`).join('')}</select></div>

    <div style="grid-column:1/-1"><label>Invoice footer / terms</label><textarea name="invoiceTerms">${esc(m.invoiceTerms)}</textarea></div></div></div>
  <div class="card" style="margin-top:12px"><div class="section" style="margin-top:0">Sales tax rates</div><table id="rates">${m.taxRates.map(rateRow).join('')}</table>
    <button type="button" onclick="addRateRow()">+ Add rate</button></div>
  <div class="card" style="margin-top:12px"><div class="section" style="margin-top:0">Custom fields <span class="hint">— add your own fields to any form (e.g. File #, Matter, Mileage, Approved by)</span></div><table id="cfs"><tr><th>Label</th><th>Appears on</th><th>Type</th><th>Choices (for list)</th><th></th></tr>${(m.customFields || []).map(cfRow).join('')}</table>
    <button type="button" onclick="$('#cfs').insertAdjacentHTML('beforeend',cfRow({id:uid(),label:'',appliesTo:'all-txn',type:'text'}))">+ Add field</button></div>
  <div class="row" style="margin:12px 0"><button class="primary" onclick="saveSettings()">Save settings</button></div></form>
  <div class="card"><div class="section" style="margin-top:0">Your data — you own it</div>
    <p>All records live in this browser's private storage on <b>this device only</b>. No account, no cloud, no server. To move it, keep a copy, or give it to your accountant, use the buttons below.</p>
    <div class="row"><button class="primary" onclick="exportBackup()">⬇ Download full backup (.json incl. receipts)</button>
    <label class="btn" style="margin:0;color:var(--ink)">⬆ Restore from backup<input type="file" accept=".json,application/json" hidden onchange="importBackup(this.files[0]);this.value=''"></label>
    ${canLink ? `<button onclick="linkFile()">${fileHandle ? '✓ Linked: ' + esc(fileHandle.name) : '🔗 Auto-save to a file on my computer'}</button>` : ''}
    <button onclick="exportTxCSV()">Export all transactions (CSV)</button><button onclick="exportListsCSV()">Export clients/vendors/accounts (CSV)</button></div>
    <p class="hint" id="storageinfo"></p>
    <p class="hint">Last backup downloaded: ${esc(m.lastBackup ? m.lastBackup.slice(0, 16).replace('T', ' ') : 'never')}. Clearing your browser's site data deletes the books — keep regular backups.</p>
    <div class="row" style="margin-top:10px"><button class="danger" onclick="resetAll()">Erase everything on this device…</button><button onclick="loadDemo()">Load demo data</button></div></div>`;
}
pageSettings.after = async () => { if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); const p = navigator.storage.persisted ? await navigator.storage.persisted() : false; const el = $('#storageinfo'); if (el) el.textContent = `Using ${(e.usage / 1048576).toFixed(1)} MB of ${(e.quota / 1048576).toFixed(0)} MB available. Persistent storage: ${p ? 'granted (browser won\'t auto-clear)' : 'not granted — back up regularly'}.`; } };
function rateRow(r) { return `<tr data-id="${r.id}"><td><input data-k="name" value="${esc(r.name)}" placeholder="e.g. PST 7%"></td><td style="width:120px"><input data-k="rate" type="number" step="any" class="num" value="${r.rate ?? ''}"></td><td style="width:40px"><button type="button" class="icon" onclick="this.closest('tr').remove()">✕</button></td></tr>`; }
function addRateRow() { $('#rates').insertAdjacentHTML('beforeend', rateRow({ id: uid(), name: '' })); }
function cfRow(cf) {
  const targets = { 'all-txn': 'All transactions', ...Object.fromEntries(Object.entries(TT).map(([k, v]) => [k, v.label])), customer: 'Clients', vendor: 'Vendors' };

  <td><select data-k="type">${['text', 'number', 'date', 'select'].map(x => `<option ${cf.type === x ? 'selected' : ''}>${x}</option>`).join('')}</select></td><td><input data-k="options" value="${esc(cf.options)}" placeholder="a, b, c"></td><td><button type="button" class="icon" onclick="this.closest('tr').remove()">✕</button></td></tr>`;
}
function saveSettings() {
  const E = $('#sform').elements; const m = clone(db.meta);
  for (const k of ['company', 'legalName', 'taxNumber', 'email', 'phone', 'currency', 'address', 'invoiceTerms', 'theme', 'taxAccountId']) m[k] = E[k].value.trim();
  m.currency = (m.currency || 'CAD').toUpperCase(); m.fyStartMonth = +E.fyStartMonth.value; m.defaultTermsDays = +E.defaultTermsDays.value || 30;
  m.taxRates = $$('#rates tr[data-id]').map(tr => ({ id: tr.dataset.id, name: tr.querySelector('[data-k=name]').value.trim(), rate: +tr.querySelector('[data-k=rate]').value || 0 })).filter(r => r.name);
  m.customFields = $$('#cfs tr[data-id]').map(tr => { const o = { id: tr.dataset.id }; tr.querySelectorAll('[data-k]').forEach(i => o[i.dataset.k] = i.value.trim()); return o; }).filter(c => c.label);
  saveMeta(m); render(); toast('Settings saved');

const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function buildBackup() { const files = await fileAll(); const out = []; for (const f of files) { const { blob, ...rest } = f; out.push({ ...rest, data: await blobToDataURL(blob) }); } return JSON.stringify({ app: 'OwnBooks', exported: nowISO(), db, files: out }); }
async function exportBackup() { const s = await buildBackup(); db.meta.lastBackup = nowISO(); save(); download(`${(db.meta.company || 'books').replace(/[^\w-]+/g, '_')}-backup-${today()}.json`, s, 'application/json'); render(); }
async function importBackup(file) {
  if (!file) return; try {
    const j = JSON.parse(await file.text()); const d = j.db || j; if (!d.accounts || !d.txns) throw new Error('Not an OwnBooks backup');
    if (!confirm(`Replace ALL data on this device with the backup "${file.name}" (${d.txns.length} transactions)? Download a backup of the current data first if unsure.`)) return;
    db = normalize(d); await kvSet('db', db); await fileClear();
    for (const f of j.files || []) { const blob = await (await fetch(f.data)).blob(); const { data, ...rest } = f; await filePut({ ...rest, blob }); }
    _fmt = null; render(); alert('Backup restored.');
  } catch (e) { alert('Could not restore: ' + e.message); }
}
async function linkFile() {
  try { fileHandle = await window.showSaveFilePicker({ suggestedName: `${(db.meta.company || 'books').replace(/[^\w-]+/g, '_')}-ownbooks.json`, types: [{ description: 'OwnBooks data', accept: { 'application/json': ['.json'] } }] });
    await writeLinkedFile(); render(); } catch (e) { if (e.name !== 'AbortError') alert(e.message); }
}
async function writeLinkedFile() { try { const w = await fileHandle.createWritable(); await w.write(await buildBackup()); await w.close(); } catch (e) { toast('File save failed: ' + e.message); } }
function exportListsCSV() {
  const rows = [['List', 'Name', 'Company', 'Email', 'Phone', 'Address', 'Tax #', 'Number/Type', 'Notes']];
  db.customers.forEach(p => rows.push(['Client', p.name, p.company, p.email, p.phone, p.address, p.taxNumber, '', p.notes]));
  db.vendors.forEach(p => rows.push(['Vendor', p.name, p.company, p.email, p.phone, p.address, p.taxNumber, '', p.notes]));
  db.accounts.forEach(a => rows.push(['Account', a.name, '', '', '', '', a.taxLine, a.number + ' ' + a.type + '/' + a.subtype, a.desc]));
  download('lists.csv', toCSV(rows), 'text/csv');
}

/* ---------- boot ---------- */
async function boot() {
  $('#modal').addEventListener('close', runModalClose);
  try { idb = await idbOpen(); db = await kvGet('db'); } catch (e) { alert('This browser blocked local storage (private mode?). Data will not persist: ' + e.message); }
  if (!db) { const legacy = localStorage.getItem('ownbooks-data-v1'); db = legacy ? JSON.parse(legacy) : seed(); if (idb) await kvSet('db', db); }
  db = normalize(db);
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => { });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  render();
  if (new URLSearchParams(location.search).has('oauth_state_id')) { location.hash = 'banking'; ui.bankTab = 'connect'; connectPlaid(null, true); }
  else if (db.meta.bankLinks?.autoSync && Object.keys(db.meta.bankLinks.accounts || {}).length) syncAll(true);
}
window.addEventListener('beforeunload', () => { if (saveTimer && idb) kvSet('db', db); });
boot();
